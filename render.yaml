services:
  - type: web
    name: cyber-intelligence-observatory
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ABUSEIPDB_API_KEY
        sync: false
      - key: ENABLE_CACHE_CLEAR
        value: "false"
